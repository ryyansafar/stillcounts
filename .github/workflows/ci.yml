name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pytest pytest-cov hypothesis fastapi uvicorn requests httpx jsonschema segno
      - run: python -m pytest -q --cov=stillcounts --cov=server --cov=oracle
      - run: node --test client/test/
      - run: python -m oracle.oracle --seed 0xA3 --ops 240 --perms 200
      - run: python -m oracle.mutation
