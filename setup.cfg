[mutmut]
source_paths=stillcounts/crdt.py
also_copy=
    oracle/
    tests/
    client/
    scripts/
pytest_add_cli_args_test_selection=
    tests/test_crdt.py
    tests/test_crdt_validation.py
    tests/test_vectors.py
    tests/test_oracle_permutations.py

[tool:pytest]
testpaths = tests
norecursedirs = mutants .venv node_modules

[coverage:run]
# Subprocess workers and a command-line driver: tests run them (in a child process, or for 18 minutes), but in-process
# coverage cannot see inside a child process.
omit =
    server/live_run.py
    learn/course_runner.py
    chaos/run.py
